name: Update and publish SMARTMoraga election widget

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: smartmoraga-election-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check custom domain DNS and HTTPS
        run: |
          python3 - <<'PY'
          import socket,ssl,datetime,urllib.request
          host='results.smartmoraga.com'
          try:
              print('DNS addresses:',sorted({x[4][0] for x in socket.getaddrinfo(host,443)}),flush=True)
              with socket.create_connection((host,443),timeout=8) as raw:
                  with ssl.create_default_context().wrap_socket(raw,server_hostname=host) as sock:
                      cert=sock.getpeercert()
                      print('HTTPS certificate valid; expires:',cert.get('notAfter'),flush=True)
              with urllib.request.urlopen('https://'+host+'/',timeout=10) as r:
                  print('HTTPS response:',r.status,'final URL:',r.url,flush=True)
          except Exception as e:
              print('Custom domain not fully ready:',type(e).__name__,str(e),flush=True)
          PY
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF extraction support
        run: python -m pip install -q 'pypdf>=6,<7'
      - name: Test updater
        run: python -m unittest discover -s tests -v
      - name: Retrieve and validate current Clarity results
        run: |
          if python scripts/update.py; then
            echo 'Latest complete verified dataset retained or updated.'
          else
            echo '::warning::Source inaccessible or incomplete; retaining last verified snapshot.'
          fi
      - name: Commit verified results only when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official election vote totals'
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload widget site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs
      - name: Deploy widget site
        id: deployment
        uses: actions/deploy-pages@v4
