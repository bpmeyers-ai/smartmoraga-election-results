name: Install and publish SMARTMoraga election widget
on:
  push:
    paths:
      - '.github/workflows/install-widget.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: smartmoraga-election-pages
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and unpack tested widget package
        run: |
          base64 --decode .widget-bundle.b64 > /tmp/smartmoraga-widget.tar.xz
          echo "b66d9bb6d4fc2197090fa78ef60352716f5ce95277cfac4cb78c9b433b6f797e  /tmp/smartmoraga-widget.tar.xz" | sha256sum --check -
          tar -xJf /tmp/smartmoraga-widget.tar.xz
          rm .widget-bundle.b64
      - name: Test source
        run: python3 -m unittest discover -s tests -v
      - name: Install normal files in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs scripts tests .github/workflows/election-widget.yml .widget-bundle.b64
          git commit -m "Install tested SMARTMoraga election widget"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
